server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Kubernetes liveness/readiness probe endpoint
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Runtime config rendered at container start — must never be cached
    location = /config.json {
        add_header Cache-Control "no-store";
    }

    # Hashed Vite build assets are content-addressed and safe to cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html, sw.js and manifest must revalidate so PWA updates propagate
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
